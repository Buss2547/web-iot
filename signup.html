<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Vigil Security</title>
  <meta name="description" content="Create a new Vigil Security account.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a class="auth-brand" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      SECURITY
    </a>

    <h1>CREATE ACCOUNT.</h1>
    <p class="auth-subtitle">Get started with your smart IoT surveillance network.</p>

    <form class="auth-form" id="authForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <button class="auth-btn" type="submit">SIGN UP</button>
    </form>

    <p class="switch-auth">
      Already have an account? <a href="login.html">LOGIN</a>
    </p>
  </div>

  <script src="js/auth.js" defer></script>
</body>
</html>
