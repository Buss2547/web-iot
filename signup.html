<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signup — Security</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-card"><a class="brand small" href="index.html">SECURITY</a><h1>CREATE ACCOUNT.</h1>
<form onsubmit="event.preventDefault(); location.href='detection.html'">
<label>Full name</label><input type="text" placeholder="Your name" required>
<label>Email</label><input type="email" placeholder="you@example.com" required>
<label>Password</label><input type="password" placeholder="Create a password" required>
<button class="cta full">SIGN UP</button></form><p class="switch">Already have an account? <a href="login.html">LOGIN</a></p></div>
</body></html>
