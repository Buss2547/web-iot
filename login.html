<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vigil Security</title>
  <meta name="description" content="Sign in to your Vigil Security dashboard.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <a class="auth-brand" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      SECURITY
    </a>

    <h1>WELCOME BACK.</h1>
    <p class="auth-subtitle">Sign in to access live monitoring and device telemetry.</p>

    <form class="auth-form" id="authForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required value="admin@vigil.io">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required value="••••••••">
      </div>

      <div class="form-options">
        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:0.85rem;">
          <input type="checkbox" checked style="width:auto; height:auto;"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="auth-btn" type="submit">SIGN IN</button>
    </form>

    <p class="switch-auth">
      Don't have an account? <a href="signup.html">SIGN UP</a>
    </p>
  </div>

  <script src="js/auth.js" defer></script>
</body>
</html>
